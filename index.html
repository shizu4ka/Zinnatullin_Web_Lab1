<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The First Lab by Web</title>
</head>
<body>
    <h1>The First Lab by Web</h1>
    <form id="formForPoint">
    <label>Input X</label>
    <ul id="X">
        <li><button type="button">-2</button></li>
        <li><button type="button">-1.5</button></li>
        <li><button type="button">-1</button></li>
        <li><button type="button">-0.5</button></li>
        <li><button type="button">0</button></li>
        <li><button type="button">0.5</button></li>
        <li><button type="button">1</button></li>
        <li><button type="button">1.5</button></li>
        <li><button type="button">2</button></li>
    </ul>
        <span id="XError"></span>
    <br>
    <label>Input Y</label>
    <input type="text" id="Y" placeholder="Input Y(-5...5)">
        <span id="YError"></span>
    <br>
    <br>
    <label>Input R</label>
    <ul id="R">
        <li><input type="radio" name="OptionR" value= "1" checked/><label>1</label></li>
        <li><input type="radio" name="OptionR" value = "2"/><label>2</label></li>
        <li><input type="radio" name="OptionR" value = "3"/><label>3</label></li>
        <li><input type="radio" name="OptionR" value = "4"/><label>4</label></li>
        <li><input type="radio" name="OptionR" value = "5"/><label>5</label></li>
    </ul>
        <input type="submit" value="Send">
    </form>
    <br>
<div id="output"></div>
<script src="index.js"></script>
</body>
</html>

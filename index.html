<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The First Lab by Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>The First Lab by Web</h1>
<form id="formForPoint">
    <label>Input X</label>
    <ul id="X">
        <li>
            <button type="button">-2</button>
        </li>
        <li>
            <button type="button">-1.5</button>
        </li>
        <li>
            <button type="button">-1</button>
        </li>
        <li>
            <button type="button">-0.5</button>
        </li>
        <li>
            <button type="button">0</button>
        </li>
        <li>
            <button type="button">0.5</button>
        </li>
        <li>
            <button type="button">1</button>
        </li>
        <li>
            <button type="button">1.5</button>
        </li>
        <li>
            <button type="button">2</button>
        </li>
    </ul>
    <span id="XError"></span>
    <br>
    <label>Input Y</label>
    <input type="text" id="Y" pattern="^-?(?:[0-4](?:[.,]\d+)?|5(?:[.,]0+)?)$" placeholder="Input Y(-5...5)">
    <span id="YError"></span>
    <label>Input R</label>
    <ul id="R">
        <li><input type="radio" name="OptionR" value="1" checked/><label>1</label></li>
        <li><input type="radio" name="OptionR" value="2"/><label>2</label></li>
        <li><input type="radio" name="OptionR" value="3"/><label>3</label></li>
        <li><input type="radio" name="OptionR" value="4"/><label>4</label></li>
        <li><input type="radio" name="OptionR" value="5"/><label>5</label></li>
    </ul>
    <input type="submit" value="Send">
</form>
<button id="reset">Reset</button>
<div>
    <table id="resultsTable">
        <thead>
        <tr>
            <th>X</th>
            <th>Y</th>
            <th>R</th>
            <th>Result</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
<div class="right-column">
    <div style="position: relative; width: 400px; height: 400px;">
        <canvas id="areaCanvas" width="400" height="400"
                style="position: absolute; left: 0; top: 0; background-color: #ffffff;"></canvas>
        <canvas id="areaCanvasPoints" width="400" height="400"
                style="position: absolute; left: 0; top: 0; background: none !important;;"></canvas>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
